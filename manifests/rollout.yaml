apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-simple-webserver
  labels:
    app: go-simple-webserver
spec:
  replicas: 10
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
  selector:
    matchLabels:
      app: go-simple-webserver
  template:
    metadata:
      labels:
        app: go-simple-webserver
    spec:
      containers:
        - name: webserver
          image: ghcr.io/cozma-andrei/ci_cd_lab@sha256:a62fa0010f7d2fe93413658dd0a74a0cda841d2290599cdfaeda5c89c357f532
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
